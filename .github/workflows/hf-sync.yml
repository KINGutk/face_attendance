name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "feature/advanced-ai" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://kabeerUTK:$HF_TOKEN@huggingface.co/spaces/kabeerUTK/advanced-face-attendance
          git push hf feature/advanced-ai:main --force
