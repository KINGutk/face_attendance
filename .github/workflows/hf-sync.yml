name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ deploy-hf ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://afghan50002:$HF_TOKEN@huggingface.co/spaces/afghan50002/face-attendance deploy-hf:main
