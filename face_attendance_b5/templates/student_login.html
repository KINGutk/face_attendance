{% extends "base.html" %}

{% block page_title %}Student Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-5 text-center">
        <h2 class="fw-bold mb-4 text-primary">🎓 Student Portal</h2>
        
        <form method="POST">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" name="roll_no" id="roll_no" placeholder="Roll Number" required>
            <label for="roll_no">Roll Number</label>
          </div>
          <div class="form-floating mb-4 position-relative">
            <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
            <label for="password">Password</label>
            <button type="button" class="btn border-0 position-absolute end-0 top-50 translate-middle-y me-2" onclick="togglePassword()" style="z-index: 10;">👁️</button>
          </div>
          
          <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold shadow-sm mb-3">Login</button>
        </form>

        <p class="mb-4 text-muted">Don't have an account? <a href="{{ url_for('student_signup') }}" class="text-primary fw-bold text-decoration-none">Sign up here</a></p>

        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 shadow-sm">🔐 Admin</a>
          <a href="{{ url_for('professor_login') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 shadow-sm">👨‍🏫 Faculty</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.querySelector('.form-floating button');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleButton.textContent = '🙈';
    } else {
      passwordInput.type = 'password';
      toggleButton.textContent = '👁️';
    }
  }
</script>
{% endblock %}
