{% extends "base.html" %}

{% block page_title %}Admin Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-5 text-center">
        <h2 class="fw-bold mb-4">🔐 Admin Portal</h2>
        
        <form method="POST">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" name="username" id="username" placeholder="Username" required>
            <label for="username">Username</label>
          </div>
          <div class="form-floating mb-4">
            <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
            <label for="password">Password</label>
          </div>
          
          <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold shadow-sm mb-4">Login</button>
        </form>

        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('professor_login') }}" class="text-decoration-none text-muted fw-semibold">Faculty Login</a>
          <span class="text-muted">|</span>
          <a href="{{ url_for('student_login') }}" class="text-decoration-none text-muted fw-semibold">Student Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
