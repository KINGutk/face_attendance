{% extends "base.html" %}
{% block page_title %}Edit Class{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-5">
        <h3 class="fw-bold text-center text-primary mb-4">✏️ Update Class Schedule</h3>

        {% if error %}
          <div class="alert alert-danger rounded-3 fw-bold text-center" role="alert">
            ⚠️ Overlap Detected: {{ error }}
          </div>
        {% endif %}

        <form method="POST">
          <div class="form-floating mb-3">
            <input type="text" name="subject_name" class="form-control" id="subjectName" value="{{ class_info.subject_name }}" required>
            <label for="subjectName">Subject Name</label>
          </div>

          <div class="form-floating mb-3">
            <select name="professor_id" class="form-select" id="profSelect" required>
              {% for p in professors %}
                <option value="{{ p.id }}" {% if p.id == class_info.professor_id %}selected{% endif %}>
                  {{ p.name }}
                </option>
              {% endfor %}
            </select>
            <label for="profSelect">Professor</label>
          </div>

          <div class="form-floating mb-3">
            <select name="semester" class="form-select" id="semSelect" required>
              <option value="{{ class_info.semester }}" selected>{{ class_info.semester }} (Current)</option>
              <option value="1st Semester">1st Semester</option>
              <option value="2nd Semester">2nd Semester</option>
              <option value="3rd Semester">3rd Semester</option>
              <option value="4th Semester">4th Semester</option>
              <option value="5th Semester">5th Semester</option>
              <option value="6th Semester">6th Semester</option>
              <option value="7th Semester">7th Semester</option>
              <option value="8th Semester">8th Semester</option>
            </select>
            <label for="semSelect">Semester</label>
          </div>

          <div class="form-floating mb-3">
            <select name="day_of_week" class="form-select" id="daySelect" required>
              <option value="{{ class_info.day_of_week }}" selected>{{ class_info.day_of_week }} (Current)</option>
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
              <option>Saturday</option>
              <option>Sunday</option>
            </select>
            <label for="daySelect">Day of Week</label>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <div class="form-floating">
                <input type="time" name="start_time" class="form-control" id="startTime" value="{{ class_info.start_time }}" required>
                <label for="startTime">Start Time</label>
              </div>
            </div>
            <div class="col-6">
              <div class="form-floating">
                <input type="time" name="end_time" class="form-control" id="endTime" value="{{ class_info.end_time }}" required>
                <label for="endTime">End Time</label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary rounded-pill w-100 py-3 fw-bold shadow-sm mb-3">💾 Save Changes</button>
          <div class="text-center">
            <a href="{{ url_for('manage_classes') }}" class="text-decoration-none text-muted">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
