{% extends "base.html" %}

{% block page_title %}Faculty Registration{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-5 text-center">
        <h2 class="fw-bold mb-4 text-success">👨‍🏫 Faculty Signup</h2>
        
        {% if message %}
          <div class="alert alert-success rounded-3 fw-semibold">{{ message }}</div>
        {% endif %}
        {% if error %}
          <div class="alert alert-danger rounded-3 fw-semibold">{{ error }}</div>
        {% endif %}

        <form method="POST">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" name="name" id="name" placeholder="Dr. John Doe" required>
            <label for="name">Full Name</label>
          </div>
          
          <div class="form-floating mb-3">
            <input type="email" class="form-control" name="email" id="email" placeholder="name@college.edu" required>
            <label for="email">College Email</label>
          </div>

          <div class="form-floating mb-3">
            <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
            <label for="password">Password</label>
          </div>

          <div class="form-floating mb-4">
            <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>
            <label for="confirm_password">Confirm Password</label>
          </div>

          <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold shadow-sm mb-4">🚀 Apply for Account</button>
        </form>

        <p class="text-muted mb-0">Already have an account? <a href="{{ url_for('professor_login') }}" class="text-success fw-bold text-decoration-none">Login Here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
