<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡 Live Attendance Scanner</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#00ff88">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00ff88;
      --green-dim: rgba(0,255,136,0.15);
      --orange: #ffaa00;
      --red: #ff4444;
      --blue: #00e5ff;
      --bg: #080c0f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e8f0f8;
      --muted: #6b7a8d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 60px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    .wrapper { position: relative; z-index: 1; width: 100%; max-width: 580px; }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .top-bar h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4em;
      font-weight: 700;
      color: #fff;
    }
    .top-bar h1 span { color: var(--green); }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.3);
      padding: 5px 12px; border-radius: 20px;
      font-size: 0.75em; font-weight: 600; color: #ff6666;
    }
    .live-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0.2; } }

    /* Class info */
    .class-card {
      background: var(--green-dim);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .class-card .cc-icon { font-size: 1.4em; }
    .class-card .cc-text { font-size: 0.9em; font-weight: 600; color: var(--green); }
    .class-card .cc-sub { font-size: 0.75em; color: var(--muted); margin-top: 2px; }

    /* Camera */
    .cam-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(0,255,136,0.2);
      aspect-ratio: 4/3;
      margin-bottom: 16px;
      box-shadow: 0 0 40px rgba(0,255,136,0.05);
    }

    video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    /* Face tracking overlay */
    .face-overlay {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    /* Animated oval */
    .face-oval-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .face-oval {
      width: 42%;
      aspect-ratio: 3/4;
      border: 2px solid rgba(0,255,136,0.4);
      border-radius: 50%;
      transition: all 0.4s;
      box-shadow: inset 0 0 20px rgba(0,255,136,0.05);
    }
    .face-oval.scanning { border-color: var(--orange); animation: pulse-oval 1s infinite; }
    .face-oval.matched  { border-color: var(--green);  box-shadow: 0 0 25px rgba(0,255,136,0.4), inset 0 0 20px rgba(0,255,136,0.1); }
    .face-oval.unknown  { border-color: var(--red); }
    @keyframes pulse-oval { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.03); } }

    /* Scan line */
    .scan-line {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      animation: scan 2.5s infinite ease-in-out;
      opacity: 0.6;
    }
    @keyframes scan { 0%{ top:10%; } 50%{ top:88%; } 100%{ top:10%; } }

    /* Corner brackets */
    .c { position: absolute; width: 22px; height: 22px; }
    .c.tl { top:12px; left:12px; border-top:2px solid var(--green); border-left:2px solid var(--green); border-radius:3px 0 0 0; }
    .c.tr { top:12px; right:12px; border-top:2px solid var(--green); border-right:2px solid var(--green); border-radius:0 3px 0 0; }
    .c.bl { bottom:12px; left:12px; border-bottom:2px solid var(--green); border-left:2px solid var(--green); border-radius:0 0 0 3px; }
    .c.br { bottom:12px; right:12px; border-bottom:2px solid var(--green); border-right:2px solid var(--green); border-radius:0 0 3px 0; }

    /* Liveness challenge overlay */
    .liveness-challenge {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,170,0,0.4);
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 0.8em;
      font-weight: 600;
      color: var(--orange);
      white-space: nowrap;
      display: none;
    }
    .liveness-challenge.active { display: block; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from{ opacity:0; transform:translateX(-50%) translateY(10px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }

    /* Status */
    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.3s;
    }
    .status-icon { font-size: 1.8em; flex-shrink: 0; }
    .status-text { font-weight: 600; font-size: 0.95em; }
    .status-sub  { font-size: 0.78em; color: var(--muted); margin-top: 3px; }

    .status-card.green  { background: rgba(0,255,136,0.07); border-color: rgba(0,255,136,0.25); }
    .status-card.green .status-text  { color: var(--green); }
    .status-card.red    { background: rgba(255,68,68,0.07);  border-color: rgba(255,68,68,0.25); }
    .status-card.red .status-text    { color: var(--red); }
    .status-card.orange { background: rgba(255,170,0,0.07); border-color: rgba(255,170,0,0.25); }
    .status-card.orange .status-text { color: var(--orange); }
    .status-card.blue   { background: rgba(0,229,255,0.07); border-color: rgba(0,229,255,0.25); }
    .status-card.blue .status-text   { color: var(--blue); }

    /* Liveness steps row */
    .liveness-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .liveness-chip {
      flex: 1;
      min-width: 70px;
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
      font-size: 0.7em;
      color: var(--muted);
      transition: all 0.3s;
    }
    .liveness-chip .lc-icon { font-size: 1.3em; display: block; margin-bottom: 3px; }
    .liveness-chip.active { border-color: rgba(255,170,0,0.4); background: rgba(255,170,0,0.08); color: var(--orange); }
    .liveness-chip.done   { border-color: rgba(0,255,136,0.4); background: rgba(0,255,136,0.08); color: var(--green); }

    /* Recent log */
    .log-section { margin-bottom: 16px; }
    .log-title {
      font-size: 0.72em; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .log-entry {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 6px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
    .log-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--green-dim); border: 1px solid rgba(0,255,136,0.3);
      display: flex; align-items: center; justify-content: center; font-size: 0.9em;
      flex-shrink: 0;
    }
    .log-name  { font-size: 0.85em; font-weight: 600; }
    .log-time  { font-size: 0.72em; color: var(--muted); }
    .log-badge { margin-left: auto; padding: 3px 10px; border-radius: 20px; font-size: 0.7em; font-weight: 600; }
    .log-badge.present { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
    .log-badge.unknown { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid rgba(255,68,68,0.3); }

    /* Back button */
    .btn-dashboard {
      display: inline-block;
      margin: 30px auto;
      background: transparent;
      border: 2px solid #00ff88;
      color: #00ff88;
      padding: 10px 25px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      text-align: center;
    }
    .btn-dashboard:hover {
      background: #00ff88;
      color: #000;
    }
    .center-btn {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    canvas { display: none; }
  </style>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="wrapper">

  <!-- Top bar -->
  <div class="top-bar">
    <h1>📡 Live <span>Scanner</span></h1>
    <div class="live-badge"><div class="live-dot"></div> LIVE</div>
  </div>

  <!-- Class info -->
  <div class="class-card">
    <div class="cc-icon">📚</div>
    <div>
      <div class="cc-text" id="classDisplay">⌛ Connecting to session...</div>
      <div class="cc-sub" id="classSub">Waiting for active class</div>
    </div>
  </div>

  <!-- Camera -->
  <div class="cam-container">
    <video id="video" autoplay playsinline></video>
    <div class="face-overlay">
      <div class="scan-line"></div>
      <div class="face-oval-wrap">
        <div class="face-oval scanning" id="faceOval"></div>
      </div>
      <div class="c tl"></div><div class="c tr"></div>
      <div class="c bl"></div><div class="c br"></div>
    </div>
    <div class="liveness-challenge" id="livenessChallenge">👁️ Please blink your eyes</div>
  </div>

  <!-- Liveness chips -->
  <div class="liveness-row" id="livenessRow">
    <div class="liveness-chip" id="lc_face"><span class="lc-icon">🎯</span>Face Found</div>
    <div class="liveness-chip" id="lc_live"><span class="lc-icon">✅</span>Liveness</div>
    <div class="liveness-chip" id="lc_match"><span class="lc-icon">🪪</span>ID Match</div>
    <div class="liveness-chip" id="lc_conf"><span class="lc-icon">📊</span>Confidence</div>
  </div>

  <!-- Status -->
  <div class="status-card" id="statusCard">
    <div class="status-icon" id="statusIcon">🔍</div>
    <div>
      <div class="status-text" id="statusText">Waiting for camera...</div>
      <div class="status-sub" id="statusSub">Please allow camera access</div>
    </div>
  </div>

  <!-- Recent log -->
  <div class="log-section">
    <div class="log-title">📋 Recent Attendance</div>
    <div id="logList"></div>
    <div id="logEmpty" style="font-size:0.8em;color:var(--muted);text-align:center;padding:10px;">No attendance marked yet</div>
  </div>
  <div class="center-btn">
    <a href="{{ url_for('professor_dashboard' if session.get('role') == 'professor' else 'index') }}" class="btn-dashboard">🏠 Back to Dashboard</a>
  </div>

</div>

<canvas id="canvas"></canvas>

<script>
const video       = document.getElementById('video');
const canvas      = document.getElementById('canvas');
const statusCard  = document.getElementById('statusCard');
const statusIcon  = document.getElementById('statusIcon');
const statusText  = document.getElementById('statusText');
const statusSub   = document.getElementById('statusSub');
const faceOval    = document.getElementById('faceOval');
const classDisp   = document.getElementById('classDisplay');
const classSub    = document.getElementById('classSub');
const logList     = document.getElementById('logList');
const logEmpty    = document.getElementById('logEmpty');
const livenessChallenge = document.getElementById('livenessChallenge');

const CHALLENGES = [
  { text: '👁️ Blink your eyes slowly', key: 'blink' },
  { text: '😊 Give a smile', key: 'smile' },
  { text: '⬆️ Slowly look up', key: 'up' },
  { text: '⬅️ Turn head slightly left', key: 'left' },
];
let challengeIdx = 0;
let currentChallenge = CHALLENGES[0].key;
let lastMarked = {};
let isSending = false;
let challengePassed = false;
let livenessPassedFrames = 0; // Require a few consecutive frames of passing to avoid false positives

// ---- Chip helpers ----
function chipActive(id) { document.getElementById('lc_' + id).className = 'liveness-chip active'; }
function chipDone(id) { document.getElementById('lc_' + id).className = 'liveness-chip done'; }
function chipReset(id) { document.getElementById('lc_' + id).className = 'liveness-chip'; }
function resetChips() { ['face','live','match','conf'].forEach(chipReset); }

function setStatus(icon, text, sub, color) {
  statusIcon.textContent = icon;
  statusText.textContent = text;
  statusSub.textContent  = sub || '';
  statusCard.className   = 'status-card ' + (color || '');
}

function addLog(name, roll, status) {
  const key = name + roll;
  if (lastMarked[key] && Date.now() - lastMarked[key] < 30000) return;
  lastMarked[key] = Date.now();
  if (logEmpty) logEmpty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `
    <div class="log-avatar">${name.charAt(0)}</div>
    <div style="flex:1">
      <div class="log-name">${name}</div>
      <div class="log-time">${new Date().toLocaleTimeString()}</div>
    </div>
    <div class="log-badge ${status === 'Present' ? 'present' : 'unknown'}">${status}</div>`;
  logList.prepend(div);
  const entries = logList.querySelectorAll('.log-entry');
  if (entries.length > 5) entries[entries.length-1].remove();
}

function rotateLivenessChallenge() {
  const c = CHALLENGES[challengeIdx % CHALLENGES.length];
  currentChallenge = c.key;
  livenessChallenge.textContent = c.text;
  livenessChallenge.classList.add('active');
  challengeIdx++;
  challengePassed = false;
  livenessPassedFrames = 0;
}

// MediaPipe Math Helpers
function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}
function getEAR(lm, eyeIndices) {
  const v1 = dist(lm[eyeIndices[1]], lm[eyeIndices[5]]);
  const v2 = dist(lm[eyeIndices[2]], lm[eyeIndices[4]]);
  const h = dist(lm[eyeIndices[0]], lm[eyeIndices[3]]);
  return (v1 + v2) / (2.0 * h);
}

function checkLiveness(landmarks) {
  if (currentChallenge === 'blink') {
    const l_ear = getEAR(landmarks, [33, 160, 158, 133, 153, 144]);
    const r_ear = getEAR(landmarks, [362, 385, 387, 263, 373, 380]);
    return ((l_ear + r_ear) / 2) < 0.22; 
  }
  if (currentChallenge === 'smile') {
    const mouth = dist(landmarks[61], landmarks[291]);
    const face = dist(landmarks[234], landmarks[454]);
    return (mouth / face) > 0.40;
  }
  if (currentChallenge === 'left') {
    // MediaPipe normalizes Z based on face size.
    // Right cheek (454) vs Left cheek (234). User turns head left = their left cheek moves away (Z increases).
    return landmarks[234].z > (landmarks[454].z + 0.04);
  }
  if (currentChallenge === 'up') {
    const eyeY = (landmarks[33].y + landmarks[263].y) / 2;
    const noseY = landmarks[1].y;
    // Lower y is physically higher on screen
    return (noseY - eyeY) < 0.07;
  }
  return false;
}

// Send frame to server ONCE
async function sendFrameToServer() {
  if (isSending) return;
  isSending = true;

  // Capture current video frame
  const ctx = canvas.getContext('2d');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  const dataURL = canvas.toDataURL('image/jpeg', 0.8);

  chipActive('match');
  faceOval.className = 'face-oval scanning';
  setStatus('🔍', 'Verifying ID...', 'Hold still inside the oval', 'orange');

  try {
    const res  = await fetch('/process_frame', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataURL }),
      credentials: 'same-origin'
    });
    const data = await res.json();

    const msg   = data.message || '';
    const color = data.color   || '';
    const cls   = data.current_class || 'No active class';
    let simText = '';
    if (data.sim_score !== undefined) {
      const pct = (data.sim_score * 100).toFixed(1);
      simText = `Similarity Score: ${pct}% (Threshold: 45%)`;
    }

    classDisp.textContent = '📚 ' + cls;
    classSub.textContent  = new Date().toLocaleTimeString();

    if (color === '#00ff88' || color === 'green' || msg.includes('Marked') || msg.includes('Present')) {
      chipDone('match'); chipDone('conf');
      faceOval.className = 'face-oval matched';
      livenessChallenge.classList.remove('active');
      setStatus('✅', msg, simText || 'Attendance marked successfully', 'green');
      const nameMatch = msg.match(/✅ (.+?) marked/);
      const name = nameMatch ? nameMatch[1] : 'Student';
      addLog(name, '', 'Present');
    } else if (msg.includes('Unknown') || msg.includes('not recognized') || color === 'red') {
      chipReset('match'); chipReset('conf');
      faceOval.className = 'face-oval unknown';
      setStatus('❓', 'Face not recognized', simText || 'Not in the student database', 'red');
    } else if (msg.includes('Wrong Class')) {
      chipDone('match');
      faceOval.className = 'face-oval matched';
      setStatus('⚠️', msg, simText || 'Student belongs to a different semester', 'orange');
    } else if (msg.includes('already') || msg.includes('Already')) {
      chipDone('match');
      faceOval.className = 'face-oval matched';
      setStatus('✔️', msg, simText || 'Attendance was already recorded', 'blue');
    } else if (color === 'cyan' || color === 'blue') {
      setStatus('⚠️', msg, simText || 'Face not recognized in database', color);
    } else {
      faceOval.className = 'face-oval unknown';
      setStatus('🔍', msg, 'Scanning...', 'orange');
    }
  } catch (err) {
    console.error(err);
    setStatus('⚠️', 'Connection issue', 'Retrying...', '');
    resetChips();
  }

  // Cooldown before next scan
  setTimeout(() => {
    isSending = false;
    rotateLivenessChallenge();
    resetChips();
    faceOval.className = 'face-oval scanning';
    setStatus('👁️', 'Awaiting Liveness', 'Please perform the challenge below', 'orange');
  }, 3500);
}

// MediaPipe Setup
const faceMesh = new FaceMesh({locateFile: (file) => {
  return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
}});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
  if (isSending) return; // Wait if we are verifying

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    chipActive('face');
    chipActive('live');
    faceOval.className = 'face-oval scanning';
    
    if (!livenessChallenge.classList.contains('active')) {
      setStatus('👁️', 'Awaiting Liveness', 'Please perform the challenge below', 'orange');
      livenessChallenge.classList.add('active');
    }

    const landmarks = results.multiFaceLandmarks[0];
    const passed = checkLiveness(landmarks);

    if (passed) {
      livenessPassedFrames++;
      if (livenessPassedFrames > 2) { // Passed for 3 frames continuously
        challengePassed = true;
        chipDone('live');
        chipDone('face');
        livenessChallenge.textContent = '✔️ Challenge Passed!';
        livenessChallenge.style.background = 'rgba(0,255,136,0.1)';
        livenessChallenge.style.color = 'var(--green)';
        livenessChallenge.style.borderColor = 'var(--green)';
        
        // Trigger capture
        sendFrameToServer();
      }
    } else {
      // Allow minor flickers by not resetting immediately, or reset if desired
      // livenessPassedFrames = 0; 
      livenessChallenge.style.background = 'rgba(255,255,255,0.05)';
      livenessChallenge.style.color = '#fff';
      livenessChallenge.style.borderColor = 'var(--border)';
    }

  } else {
    chipReset('face');
    chipReset('live');
    faceOval.className = 'face-oval scanning';
    setStatus('🔍', 'Looking for face', 'Position your face inside the oval', 'orange');
    livenessPassedFrames = 0;
  }
});

const camera = new Camera(video, {
  onFrame: async () => {
    await faceMesh.send({image: video});
  },
  width: 640,
  height: 480
});

rotateLivenessChallenge();
camera.start().then(() => {
  setStatus('🔍', 'Camera Started', 'Warming up AI engine...', 'orange');
}).catch(err => {
  setStatus('❌', 'Camera blocked!', 'Allow camera access in your browser settings', 'red');
  faceOval.className = 'face-oval unknown';
});

</script>
</body>
</html>
