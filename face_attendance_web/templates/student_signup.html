<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 Smart Student Signup</title>
  <meta name="theme-color" content="#00ff88">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00ff88;
      --green-dim: rgba(0,255,136,0.15);
      --orange: #ffaa00;
      --red: #ff4444;
      --blue: #00e5ff;
      --bg: #080c0f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e8f0f8;
      --muted: #6b7a8d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .kyc-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--green);
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      color: white;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    /* Camera Section */
    .camera-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: rgba(0,0,0,0.2);
      border-radius: 15px;
      padding: 20px;
      border: 1px dashed var(--border);
    }

    .camera-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 20px;
      border: 3px solid var(--blue);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
      transition: all 0.4s ease;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
    }

    #scanLine {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--blue);
      box-shadow: 0 0 15px var(--blue);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #scanLine.active {
      opacity: 1;
      animation: scanAnim 1.5s infinite alternate linear;
    }

    @keyframes scanAnim {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    /* Instruction Box */
    .instruction-box {
      background: var(--surface);
      border: 1px solid var(--blue);
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      text-align: center;
      transition: all 0.3s;
    }

    .success-box {
      border-color: var(--green);
      background: var(--green-dim);
    }

    #instrIcon { font-size: 30px; margin-bottom: 5px; display: block; }
    #instrText { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
    #instrSub { font-size: 13px; color: var(--muted); }

    /* Thumbnails */
    .thumb-grid {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .thumb-img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--green);
      opacity: 0;
      animation: popIn 0.3s forwards;
    }

    @keyframes popIn {
      to { opacity: 1; transform: scale(1); }
      from { opacity: 0; transform: scale(0.5); }
    }

    /* Submit Button */
    #btnSub {
      width: 100%;
      padding: 15px;
      background: var(--green);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      opacity: 0.5;
      transition: all 0.3s;
    }

    #btnSub:not(:disabled) {
      opacity: 1;
      box-shadow: 0 0 20px var(--green-dim);
    }

    #btnSub:not(:disabled):hover {
      transform: translateY(-2px);
    }

    .alert {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    .alert-error { background: rgba(255, 68, 68, 0.1); color: var(--red); border: 1px solid var(--red); }
    .alert-success { background: rgba(0, 255, 136, 0.1); color: var(--green); border: 1px solid var(--green); }

    @media(max-width: 768px) {
      .kyc-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="kyc-container">
    <div class="form-section">
      <h2>👤 Student Details</h2>
      
      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      {% if message %}
        <div class="alert alert-success">{{ message }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('student_signup') }}" id="signupForm">
        <input type="hidden" name="face_samples" id="input_samples">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="e.g., Ajmal Khattak">
        </div>
        <div class="form-group">
          <label>Roll Number</label>
          <input type="text" name="roll_no" required placeholder="e.g., CS-2026-001">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required placeholder="e.g., ajmal@example.com">
        </div>
        <div class="form-group">
          <label>Semester</label>
          <select name="semester">
            <option value="1st Semester">1st Semester</option>
            <option value="2nd Semester">2nd Semester</option>
            <option value="3rd Semester">3rd Semester</option>
            <option value="4th Semester">4th Semester</option>
            <option value="5th Semester">5th Semester</option>
            <option value="6th Semester" selected>6th Semester</option>
            <option value="7th Semester">7th Semester</option>
            <option value="8th Semester">8th Semester</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" required>
        </div>

        <button type="submit" id="btnSub" disabled>🔒 Complete Face KYC First</button>
      </form>
    </div>

    <div class="camera-section">
      <h2>📷 Smart Face KYC</h2>
      
      <div class="camera-wrapper" id="faceOval">
        <video id="cameraFeed" autoplay playsinline muted></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
        <div id="scanLine"></div>
      </div>

      <div id="instrBox" class="instruction-box">
        <span id="instrIcon">⏳</span>
        <div id="instrText">Starting Camera...</div>
        <div id="instrSub">Please allow camera permissions</div>
      </div>

      <div class="thumb-grid" id="thumbGrid"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');
    
    const instrIcon = document.getElementById('instrIcon');
    const instrText = document.getElementById('instrText');
    const instrSub = document.getElementById('instrSub');
    const instrBox = document.getElementById('instrBox');
    const scanLine = document.getElementById('scanLine');
    const faceOval = document.getElementById('faceOval');
    const thumbGrid = document.getElementById('thumbGrid');
    const btnSub = document.getElementById('btnSub');

    // KYC Steps
    const STEPS = [
      { icon: '👤', title: 'Look Straight', sub: 'Position your face clearly in the center' },
      { icon: '⬆️', title: 'Look Slightly Up', sub: 'Tilt your head up just a bit' },
      { icon: '⬇️', title: 'Look Slightly Down', sub: 'Tilt your head down a little' },
      { icon: '⬅️', title: 'Look Left', sub: 'Turn your head slightly to the left' },
      { icon: '➡️', title: 'Look Right', sub: 'Turn your head slightly to the right' },
      { icon: '😊', title: 'Smile', sub: 'Give a natural smile for Liveness' },
      { icon: '😐', title: 'Neutral Face', sub: 'Keep a relaxed, normal expression' }
    ];

    let currentStep = 0;
    let allSamples = [];
    let stream = null;
    let autoScanInterval = null;
    let isScanning = false;

    // 1. Initialize Camera
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
        video.srcObject = stream;
        video.play();
        showInstruction(currentStep);
        
        // Start the Auto-Capture Loop
        startAutoScanner();
      } catch (err) {
        instrIcon.textContent = '❌';
        instrText.textContent = 'Camera Error';
        instrSub.textContent = 'Please allow camera access in your browser.';
        instrBox.style.borderColor = 'var(--red)';
        faceOval.style.borderColor = 'var(--red)';
      }
    }

    function showInstruction(index) {
      instrIcon.textContent = STEPS[index].icon;
      instrText.textContent = STEPS[index].title;
      instrSub.textContent  = STEPS[index].sub;
    }

    function addThumb(base64) {
      const img = document.createElement('img');
      img.src = base64;
      img.className = 'thumb-img';
      thumbGrid.appendChild(img);
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    // 2. Auto-Scanner Brain (Checks with Backend)
    function startAutoScanner() {
      scanLine.classList.add('active');
      
      autoScanInterval = setInterval(async () => {
        // Skip if currently processing or finished
        if (isScanning || currentStep >= STEPS.length) return;
        isScanning = true;

        // Grab current frame
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const base64Image = canvas.toDataURL('image/jpeg', 0.8);

        try {
          // Verify frame quality via Backend (YOLOv8 check)
          const response = await fetch('/check_photo_quality', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64Image })
          });
          const result = await response.json();

          if (result.valid) {
            // 🎉 Perfect Frame Detected!
            faceOval.style.borderColor = 'var(--green)';
            faceOval.style.boxShadow = '0 0 30px var(--green)';
            await saveFrameAndNext(base64Image);
          } else {
            // ⚠️ Frame issue (blur, multi-face, etc.)
            faceOval.style.borderColor = 'var(--red)';
            faceOval.style.boxShadow = '0 0 20px rgba(255, 68, 68, 0.3)';
            instrSub.textContent = `⚠️ ${result.error}`; 
            instrSub.style.color = 'var(--red)';
          }
        } catch (err) {
          console.log("Scanner error:", err);
        }

        isScanning = false;
      }, 1500); // Check every 1.5 seconds
    }

    // 3. Save and Move to Next Step
    async function saveFrameAndNext(base64Image) {
      isScanning = true; // Pause scanning

      allSamples.push(base64Image);
      addThumb(base64Image);

      // Success UI Feedback
      instrBox.className = 'instruction-box success-box';
      instrText.style.color = 'var(--green)';
      instrText.textContent = `✅ ${STEPS[currentStep].title} Captured!`;
      instrSub.textContent = 'Perfect!';
      instrSub.style.color = 'var(--text)';

      // Camera Flash effect
      video.style.opacity = '0.2';
      setTimeout(() => video.style.opacity = '1', 150);

      await delay(1200); // Let user see success message

      currentStep++;

      if (currentStep < STEPS.length) {
        // Load next step
        instrBox.className = 'instruction-box';
        instrText.style.color = '';
        faceOval.style.borderColor = 'var(--blue)';
        faceOval.style.boxShadow = '0 0 20px var(--blue)';
        showInstruction(currentStep);
        isScanning = false; // Resume scanning
      } else {
        // 🏁 KYC Complete
        clearInterval(autoScanInterval);
        document.getElementById('input_samples').value = JSON.stringify(allSamples);
        scanLine.classList.remove('active');
        
        if (stream) stream.getTracks().forEach(t => t.stop());

        instrBox.className = 'instruction-box success-box';
        instrIcon.textContent = '🎉';
        instrText.style.color = 'var(--green)';
        instrText.textContent = 'KYC Complete!';
        instrSub.textContent  = 'All angles captured securely.';

        video.style.display = 'none';
        faceOval.style.background = 'url("https://cdn-icons-png.flaticon.com/512/190/190411.png") center/50% no-repeat var(--green-dim)';

        btnSub.disabled = false;
        btnSub.textContent = '🎓 Submit Registration';
      }
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
